# Serial computation phase configuration for MiniFE
# Optimized for single-threaded initialization and finalization

problem_size = medium
solver_tolerance = 1.0e-8
max_iterations = 100
preconditioner = diagonal

# Serial-specific settings
thread_count = 1
affinity = compact
load_balance = disabled

# Output controls
output_level = minimal
timing_output = enabled
phase_timing = enabled

# Performance tuning
serial_optimization = enabled
memory_footprint = minimal