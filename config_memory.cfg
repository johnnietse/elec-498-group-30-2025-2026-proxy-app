# Memory-bound phase configuration for MiniFE
# Optimized for large problem sizes and memory-intensive workloads

problem_size = large
solver_tolerance = 1.0e-10
max_iterations = 500
preconditioner = none

# Memory-specific settings
cache_optimization = enabled
memory_alignment = 64
prefetch_distance = 32

# Output controls
output_level = minimal
matrix_output = disabled
vector_output = disabled

# Performance tuning
loop_unrolling = enabled
vectorization = enabled